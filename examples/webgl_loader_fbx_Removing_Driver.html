<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - FBX loader">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_loader_fbx.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_fbx.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
			Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

			const manager = new THREE.LoadingManager();
			const AMBIENT_INTENSITY = 1;
			const DIRECTIONAL_INTENSITY = 9;

			let camera, scene, renderer, controls, stats, object, loader;
			let mixer;

			// Configuración del modelo
			const MODEL_NAME = 'Removing Driver';
			const MODEL_COLOR = 0x00aaff;
			const MODEL_SCALE = 1;

			const TEXTURE_NAME = 'disturb.jpg';

			const timer = new THREE.Timer();
			timer.connect( document );


			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 100, 200, 300 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x000000 );
				scene.fog = new THREE.Fog( 0xa0a0a0, 200, 1000 );

				// ILUMINACIÓN AMBIENTAL
				const hemiLight = new THREE.HemisphereLight(
					0xffffff,
					0x555555,
					AMBIENT_INTENSITY
				);

				hemiLight.position.set(0, 300, 0);

				scene.add(hemiLight);


				// ILUMINACIÓN DIRECCIONAL SUPERIOR
				const dirLight = new THREE.DirectionalLight(
					0xffffff,
					DIRECTIONAL_INTENSITY
				);

				dirLight.position.set(150, 300, 150);

				dirLight.castShadow = true;

				dirLight.shadow.mapSize.width = 2048;
				dirLight.shadow.mapSize.height = 2048;

				dirLight.shadow.camera.near = 1;
				dirLight.shadow.camera.far = 1000;

				dirLight.shadow.camera.left = -300;
				dirLight.shadow.camera.right = 300;
				dirLight.shadow.camera.top = 300;
				dirLight.shadow.camera.bottom = -300;

				dirLight.shadow.bias = -0.0005;
				dirLight.shadow.normalBias = 0.02;

				scene.add(dirLight);

				// ground
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x999999, depthWrite: false } ) );
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
				grid.material.opacity = 0.9;
				grid.material.transparent = true;
				scene.add( grid );
			
				loader = new FBXLoader(manager);
				loadAsset(MODEL_NAME);

				renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);

// Activar sombras
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// Configuración de color
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

renderer.setAnimationLoop(animate);

container.appendChild(renderer.domElement);

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableZoom = false;
				controls.enablePan = false;
				controls.enableDamping = true;
				controls.target.set( 0, 100, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				// stats
				stats = new Stats();
				container.appendChild( stats.dom );

				

			}

			function loadAsset(asset) {

    // Cargador de texturas
    const textureLoader = new THREE.TextureLoader();

    textureLoader.load(

        'textures/' + TEXTURE_NAME,

        function (texture) {

            // Configuración de la textura
            texture.colorSpace = THREE.SRGBColorSpace;

            // Cargar modelo FBX
            loader.load(

                'models/fbx/' + asset + '.fbx',

                function (group) {

                    object = group;

                    object.scale.setScalar(MODEL_SCALE);

                    // Configurar animación
                    if (object.animations && object.animations.length > 0) {

                        mixer = new THREE.AnimationMixer(object);

                        const action = mixer.clipAction(
                            object.animations[0]
                        );

                        action.play();

                    } else {

                        mixer = null;

                        console.warn(
                            'El modelo no contiene animaciones.'
                        );

                    }

                    // Aplicar textura y configurar sombras
                    object.traverse(function (child) {

                        if (child.isMesh) {

                            child.castShadow = true;
                            child.receiveShadow = true;

                            const materials = Array.isArray(child.material)
                                ? child.material
                                : [child.material];

                            const updatedMaterials = materials.map(
                                function (material) {

                                    // Convertir materiales Basic
                                    // a materiales que reciban iluminación
                                    if (material.isMeshBasicMaterial) {

                                        const newMaterial =
                                            new THREE.MeshStandardMaterial({

                                                color: 0xffffff,

                                                roughness: 0.4,
                                                metalness: 0.1,

                                                side: material.side

                                            });

                                        material.dispose();

                                        material = newMaterial;

                                    }

                                    // Aplicar textura JPG
                                    material.map = texture;

                                    // Evitar teñir la imagen
                                    if (material.color) {

                                        material.color.set(0xffffff);

                                    }

                                    // Ajustar brillo
                                    if (material.roughness !== undefined) {

                                        material.roughness = 0.4;

                                    }

                                    if (material.metalness !== undefined) {

                                        material.metalness = 0.1;

                                    }

                                    if (material.shininess !== undefined) {

                                        material.shininess = 80;

                                    }

                                    if (material.specular) {

                                        material.specular.set(0x888888);

                                    }

                                    material.needsUpdate = true;

                                    return material;

                                }
                            );

                            child.material = Array.isArray(child.material)
                                ? updatedMaterials
                                : updatedMaterials[0];

                        }

                    });

                    scene.add(object);

                },

                function (xhr) {

                    console.log(
                        'Carga FBX: ' +
                        (xhr.loaded / xhr.total * 100).toFixed(2) +
                        '%'
                    );

                },

                function (error) {

                    console.error('Error al cargar FBX:', error);

                }

            );

        },

        undefined,

        function (error) {

            console.error('Error al cargar textura JPG:', error);

        }

    );

}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				timer.update();

				const delta = timer.getDelta();

				if ( mixer ) mixer.update( delta );

				controls.update();

				renderer.render( scene, camera );

				stats.update();

			}

		</script>

	</body>
</html>
